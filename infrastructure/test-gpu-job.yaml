apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-test-job
spec:
  template:
    spec:
      containers:
      - name: gpu-test
        image: nvidia/cuda:11.8.0-base-ubuntu22.04
        command: ["nvidia-smi"]
        resources:
          limits:
            nvidia.com/gpu: 1
      restartPolicy: Never
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
