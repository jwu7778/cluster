apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-monitor-backend
  labels:
    app: gpu-monitor-backend
spec:
  replicas: 1  # Use 1 replica for in-memory state consistency (MVP)
  selector:
    matchLabels:
      app: gpu-monitor-backend
  template:
    metadata:
      labels:
        app: gpu-monitor-backend
    spec:
      containers:
      - name: backend
        image: gpu-monitor-backend:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: MOCK_GPU
            value: "false"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-monitor-backend-service
spec:
  selector:
    app: gpu-monitor-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
