apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
  labels:
    app: nvidia-device-plugin-daemonset
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin-daemonset
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-device-plugin-daemonset
    spec:
      tolerations:
      - operator: Exists
      priorityClassName: system-node-critical
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.14.1
        name: nvidia-device-plugin-ctr
        env:
          - name: FAIL_ON_INIT_ERROR
            value: "false"
          # Inject WSL library path for compatibility
          - name: LD_LIBRARY_PATH
            value: "/host/usr/lib:/host/usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/usr/lib/wsl/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        # Mount WSL libraries into container
        - name: wsl-lib
          mountPath: /usr/lib/wsl/lib
          readOnly: true
        # Mount standard Linux libraries (for Master node)
        - name: host-lib
          mountPath: /usr/lib/x86_64-linux-gnu
          readOnly: true
        # Mount generic host /usr/lib for broader compatibility
        - name: host-usr-lib
          mountPath: /host/usr/lib
          readOnly: true
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      # Define WSL library path (DirectoryOrCreate avoids crash on non-WSL nodes)
      - name: wsl-lib
        hostPath:
          path: /usr/lib/wsl/lib
          type: DirectoryOrCreate
      # Define standard Linux library path (DirectoryOrCreate avoids crash on WSL nodes)
      - name: host-lib
        hostPath:
          path: /usr/lib/x86_64-linux-gnu
          type: DirectoryOrCreate
      # Define generic host /usr/lib
      - name: host-usr-lib
        hostPath:
          path: /usr/lib
          type: DirectoryOrCreate
