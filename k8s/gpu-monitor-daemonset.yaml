apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-monitor-agent
  labels:
    app: gpu-monitor-agent
spec:
  selector:
    matchLabels:
      app: gpu-monitor-agent
  template:
    metadata:
      labels:
        app: gpu-monitor-agent
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: agent
        image: gpu-monitor-agent:latest  # Build this locally or push to registry
        imagePullPolicy: IfNotPresent
        env:
          - name: BACKEND_URL
            value: "http://gpu-monitor-backend-service.default.svc.cluster.local:80/report"
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: MOCK_GPU
            value: "false"  # Set to true for testing
        resources:
          limits:
            nvidia.com/gpu: 1  # Request 1 GPU to access metrics
