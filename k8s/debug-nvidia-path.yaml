apiVersion: v1
kind: Pod
metadata:
  name: debug-nvidia-path
  namespace: kube-system
spec:
  restartPolicy: Never
  containers:
  - name: finder
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Searching for libnvidia-ml.so.1 on host..."
        find /host -name libnvidia-ml.so.1 2>/dev/null || echo "Not found in common paths"
        echo "Checking ldconfig cache (if available)..."
        if [ -f /host/etc/ld.so.cache ]; then
          strings /host/etc/ld.so.cache | grep libnvidia-ml
        fi
    volumeMounts:
    - name: host-root
      mountPath: /host
      readOnly: true
  volumes:
  - name: host-root
    hostPath:
      path: /
      type: Directory
